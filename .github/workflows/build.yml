name: Build IceWolf Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Grant execute
        run: chmod +x gradlew || true

      - name: Build APK
        run: |
          if [ -f gradlew ]; then ./gradlew assembleDebug
          else gradle assembleDebug; fi

      - name: Get version
        id: ver
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -1)
          [ -z "$V" ] && V="1.0"
          echo "VERSION=$V" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: sha
        run: echo "SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IceWolf-Browser-${{ steps.ver.outputs.VERSION }}-${{ steps.sha.outputs.SHORT }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: icewolf-browser-debug-apk
          path: out/*.apk

      - name: Auto Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}-${{ steps.sha.outputs.SHORT }}
          name: "IceWolf Browser v${{ steps.ver.outputs.VERSION }}"
          body: |
            ## IceWolf Browser v${{ steps.ver.outputs.VERSION }}

            Firefox-style Android browser with Chromium engine.

            ### Download
            APK file below.
          files: out/*.apk
